services:
  postgres:
    image: postgres:16-alpine
    container_name: docverify-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-docverify_db}
      POSTGRES_USER: ${POSTGRES_USER:-docverify_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_local_only}
    ports:
      # Host 5433 avoids conflicts with a local PostgreSQL already bound to 5432.
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-docverify_user} -d ${POSTGRES_DB:-docverify_db}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres_data:
