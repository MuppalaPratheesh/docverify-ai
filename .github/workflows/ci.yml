name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  # Synthetic CI-only values — never production credentials.
  DATABASE_URL: postgresql://docverify_user:change_me_local_only@localhost:5432/docverify_test?schema=public
  JWT_SECRET: ci_only_jwt_secret_value_32b
  SEED_ADMIN_EMAIL: admin@docverify.test
  SEED_ADMIN_PASSWORD: TestAdminPass123!
  SEED_REVIEWER_EMAIL: reviewer@docverify.test
  SEED_REVIEWER_PASSWORD: TestReviewerPass123!
  SEED_APPLICANT_EMAIL: applicant@docverify.test
  SEED_APPLICANT_PASSWORD: TestApplicantPass123!
  BCRYPT_SALT_ROUNDS: '10'
  UPLOAD_DIR: ./uploads-test
  COOKIE_SECURE: 'false'
  COOKIE_HTTP_ONLY: 'true'
  COOKIE_SAME_SITE: lax
  VITE_API_BASE_URL: http://localhost:4000/api

jobs:
  frontend:
    name: Frontend lint, typecheck, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: TypeScript type checking
        run: npm run typecheck

      - name: Production build
        run: npm run build

  backend-quality:
    name: Backend lint and typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: ESLint
        run: npm run lint

      - name: TypeScript type checking
        run: npm run typecheck

  backend-tests:
    name: Backend unit and integration tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: docverify_test
          POSTGRES_USER: docverify_user
          POSTGRES_PASSWORD: change_me_local_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U docverify_user -d docverify_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Unit tests
        run: npm run test:unit

      - name: Integration tests
        run: npm run test:integration

  prisma-migrate:
    name: Prisma migration validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: docverify_test
          POSTGRES_USER: docverify_user
          POSTGRES_PASSWORD: change_me_local_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U docverify_user -d docverify_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Apply migrations
        run: npm run prisma:migrate:deploy

      - name: Confirm migration status
        run: npm run prisma:migrate:status

  docker:
    name: Docker Compose and image builds
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Docker Compose configuration
        run: docker compose -f docker-compose.yml config --quiet
        env:
          POSTGRES_PASSWORD: change_me_local_only
          JWT_SECRET: ci_only_jwt_secret_value_32b
          SEED_ADMIN_PASSWORD: TestAdminPass123!
          SEED_REVIEWER_PASSWORD: TestReviewerPass123!
          SEED_APPLICANT_PASSWORD: TestApplicantPass123!

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build frontend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: docverify-ai-frontend:ci
          build-args: |
            VITE_API_BASE_URL=http://localhost:4000/api
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Build backend Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: docverify-ai-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  ci-success:
    name: CI success gate
    runs-on: ubuntu-latest
    needs:
      - frontend
      - backend-quality
      - backend-tests
      - prisma-migrate
      - docker
    steps:
      - name: All required checks passed
        run: echo "All CI jobs completed successfully."
